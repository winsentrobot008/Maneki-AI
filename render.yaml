# render.yaml — Maneki-AI Web Frontend Render Deployment Config
#
# Deployed at: https://maneki-ai.onrender.com/
#
# This service runs the Streamlit-based web frontend.
# The app.py entry point delegates to web/ui.py for the full UI.

services:
  - type: web
    name: maneki-ai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: STREAMLIT_SERVER_MAX_UPLOAD_SIZE
        value: 10
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: "false"
